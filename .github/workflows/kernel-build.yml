name: Kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out pipeline
        uses: actions/checkout@v4

      - name: Configure build tools
        run: |
          cat <<'EOF' >> /etc/pacman.conf
          [cachyos]
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          EOF
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --recv-keys E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 --keyserver keyserver.ubuntu.com
          pacman-key --recv-keys E8B9AA39F054E30E8290D492C3C4820857F654FE --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          pacman-key --lsign-key E18447AC260021D31F3FF6C4C8A2A4774B8B63C4
          pacman-key --lsign-key E8B9AA39F054E30E8290D492C3C4820857F654FE
          pacman -Syu --noconfirm --needed git sudo ccache gnupg

      - name: Configure build user
        run: |
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          install -d -m 700 /home/builder/.gnupg
          gpg --homedir /etc/pacman.d/gnupg --export E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 E8B9AA39F054E30E8290D492C3C4820857F654FE | su -s /bin/bash builder -c 'gpg --import'
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare source
        run: su builder -c 'scripts/prepare.sh artifacts'

      - name: Build package
        run: su builder -c 'scripts/build.sh artifacts/source artifacts'

      - name: Upload packages and manifest
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-kernel-packages
          path: artifacts/
